workflows:
  ios-workflow:
    name: iOS Native Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "NaijaPin/NaijaPin.xcodeproj"
        XCODE_SCHEME: "NaijaPin"
      xcode: latest
    scripts:
      - name: Build iOS App
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug
